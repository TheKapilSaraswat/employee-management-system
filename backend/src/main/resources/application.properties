spring.application.name=employee-management-system

# --- Server ------------------------------------------------------------
server.port=${PORT:5002}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# --- Compression -------------------------------------------------------
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/javascript
server.compression.min-response-size=1024

# --- Database ----------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/employeemgmt}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# --- Connection pool (HikariCP) ----------------------------------------
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=EmployeeMgmtHikariPool

# --- JWT ---------------------------------------------------------------
jwt.secret=${JWT_SECRET:dev-only-change-this-secret-employee-mgmt-2024}
jwt.expiration=${JWT_EXPIRATION_MS:604800000}

# --- Application -------------------------------------------------------
app.base-url=${APP_BASE_URL:http://localhost:5002}
app.admin-email=${ADMIN_EMAIL:}
app.admin-password=${ADMIN_PASSWORD:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5175,http://localhost:3000}

# --- Rate limiting -----------------------------------------------------
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.max-requests=${RATE_LIMIT_MAX_REQUESTS:300}
app.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}

# --- Logging -----------------------------------------------------------
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.employeemgmt=${LOG_LEVEL:INFO}
spring.output.ansi.enabled=never

# --- Jackson -----------------------------------------------------------
spring.jackson.property-naming-strategy=SNAKE_CASE

# --- OpenAPI / Swagger -------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
