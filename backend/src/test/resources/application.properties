server.port=5002
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.h2.console.enabled=true
jwt.secret=ems-jwt-secret-key-2024-must-be-at-least-32-characters-long
jwt.expiration=604800000
app.base-url=http://localhost:5002
app.cors.allowed-origins=http://localhost:5173,http://localhost:5175,http://localhost:3000
app.rate-limit.enabled=true
app.rate-limit.max-requests=300
app.rate-limit.window-seconds=60
spring.jackson.property-naming-strategy=SNAKE_CASE
