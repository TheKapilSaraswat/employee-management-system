services:
  - type: web
    name: employee-management-system-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/ready
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: employee-management-system-db
          property: connectionString
      - key: DB_DDL_AUTO
        value: update
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_BASE_URL
        sync: false

  - type: postgres
    name: employee-management-system-db
    plan: free
    databaseName: employeemgmt
    user: employeemgmt
