services:
  db:
    image: postgres:16-alpine
    container_name: employeemgmt-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-employeemgmt}
      POSTGRES_USER: ${DB_USERNAME:-employeemgmt}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-employeemgmt}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - employeemgmt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-employeemgmt} -d ${DB_NAME:-employeemgmt}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: employeemgmt-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-employeemgmt}
      DB_USERNAME: ${DB_USERNAME:-employeemgmt}
      DB_PASSWORD: ${DB_PASSWORD:-employeemgmt}
      DB_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      APP_BASE_URL: http://localhost:5002
      RATE_LIMIT_ENABLED: "true"
    ports:
      - "${BACKEND_PORT:-5002}:5002"

volumes:
  employeemgmt_pgdata:
